<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Communications | Backoffice | Maison de Gâteau Paris</title>
  <meta name="robots" content="noindex, nofollow">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="admin-shell" id="admin-notifications">
    <aside class="admin-sidebar" id="adminSidebar">
      <a class="admin-sidebar__brand" href="admin-dashboard.html">
        <svg class="brand-lockup__mark" viewBox="0 0 32 24" aria-hidden="true" focusable="false">
          <path d="M4 20 L16 6 L28 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          <line x1="16" y1="6" x2="16" y2="1" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
        <span>Backoffice</span>
      </a>

      <nav class="admin-sidebar__nav" aria-label="Backoffice">
        <a class="admin-nav-link" href="admin-dashboard.html">Dashboard</a>
        <a class="admin-nav-link" href="admin-orders.html">Orders</a>
        <a class="admin-nav-link" href="admin-customers.html">Customers</a>
        <a class="admin-nav-link" href="admin-notifications.html">Communications</a>
      </nav>
    </aside>

    <div class="admin-main">
      <header class="admin-topbar">
        <button class="admin-sidebar-toggle" id="adminSidebarToggle" type="button" aria-expanded="false" aria-controls="adminSidebar">
          <span class="sr-only">Toggle menu</span>
          <span aria-hidden="true">&#9776;</span>
        </button>
        <h1 class="admin-topbar__title">Communications</h1>
        <div class="admin-topbar__account">
          <span class="admin-topbar__who" id="adminWho"></span>
          <button class="btn btn-small" id="adminLogoutBtn" type="button">Log out</button>
        </div>
      </header>

      <main class="admin-content">
        <div id="whatsappStatusBanner"></div>

        <section class="admin-panel" aria-labelledby="inboxHeading" id="inboxSection">
          <div class="admin-panel__header">
            <h2 id="inboxHeading">Inbox</h2>
            <button class="btn btn-small" type="button" id="checkEmailBtn">Check for new messages</button>
          </div>
          <p class="admin-briefing__generated">Inbound messages that still need attention — an unrecognized sender, or a message the AI Agent couldn't turn into a draft yet. A message that already has a draft appears below in the regular list instead.</p>
          <div id="inboxContainer"></div>
        </section>

        <form class="admin-search-form" id="notificationsFilterForm" role="search">
          <select id="notificationsViewFilter" name="view" aria-label="View">
            <option value="needs_review">Needs Review</option>
            <option value="sent">Sent</option>
            <option value="all">All</option>
          </select>
          <select id="notificationsChannelFilter" name="channel" aria-label="Filter by channel">
            <option value="">All channels</option>
            <option value="email">Email</option>
            <option value="whatsapp">WhatsApp</option>
          </select>
          <select id="notificationsSourceFilter" name="source" aria-label="Filter by source">
            <option value="">All sources</option>
            <option value="automated">Automated</option>
            <option value="ai_drafted">AI-Drafted</option>
          </select>
          <button type="submit" class="btn btn-small">Filter</button>
        </form>

        <div id="notificationsTableContainer"></div>

        <div class="admin-pagination">
          <button type="button" class="btn btn-small" id="notificationsPrevPage">&larr; Previous</button>
          <span id="notificationsPageInfo"></span>
          <button type="button" class="btn btn-small" id="notificationsNextPage">Next &rarr;</button>
        </div>
      </main>
    </div>
  </div>

  <div class="admin-drawer-backdrop is-hidden" id="notificationDrawerBackdrop"></div>
  <aside class="admin-drawer is-hidden" id="notificationDrawer" aria-hidden="true" aria-label="Communication details">
    <div class="admin-drawer__header">
      <h2>Communication</h2>
      <button type="button" class="admin-drawer__close" id="notificationDrawerClose" aria-label="Close notification details">&times;</button>
    </div>
    <div class="admin-drawer__body" id="notificationDrawerBody"></div>
  </aside>

  <script src="js/api.js" defer></script>
  <script src="js/admin/auth.js" defer></script>
  <script src="js/admin/admin-api.js" defer></script>
  <script src="js/admin/ui-helpers.js" defer></script>
  <script src="js/admin/admin-layout.js" defer></script>
  <script src="js/admin/admin-notifications.js" defer></script>
</body>
</html>
