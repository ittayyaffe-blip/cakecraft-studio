<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Backoffice Login | Maison de Gâteau Paris</title>
  <meta name="robots" content="noindex, nofollow">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main id="admin-login" class="admin-login-page">
    <div class="admin-login-card">
      <p class="admin-login-card__eyebrow">Maison de Gâteau Paris</p>
      <h1 class="admin-login-card__title">Backoffice</h1>
      <p class="section-subtitle">Sign in with your staff account.</p>

      <form id="adminLoginForm" novalidate>
        <div class="form-field">
          <label for="adminEmail">Email</label>
          <input type="email" id="adminEmail" name="email" required autocomplete="username">
        </div>

        <div class="form-field">
          <label for="adminPassword">Password</label>
          <input type="password" id="adminPassword" name="password" required autocomplete="current-password">
        </div>

        <p class="admin-state admin-state--error" id="adminLoginError"></p>

        <button type="submit" class="btn btn-primary" id="adminLoginSubmit">Sign In</button>
      </form>
    </div>
  </main>

  <script src="js/api.js" defer></script>
  <script src="js/admin/auth.js" defer></script>
  <script src="js/admin/admin-api.js" defer></script>
  <script src="js/admin/admin-login.js" defer></script>
</body>
</html>
